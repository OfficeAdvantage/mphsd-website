name: Uptime check

# Fetches the live site every 30 minutes. If the home page is not a 200 with the real
# content, the www redirect breaks, or the Pages custom domain disappears, the run fails
# and an issue labelled "uptime" is opened (and commented on while the outage lasts).
# When the site is back, the open issue is closed automatically.
#
# Why: on 2026-11-01 the site served GitHub's 404 page for about seven hours after the
# repository transfer dropped the custom domain, and on 2026-11-10..12 Analytics recorded
# nothing for three days. Nobody noticed either in time. This is the alarm.
# The issue is assigned to Chris, so GitHub emails him (and pings the mobile app) the moment it opens.
#
# Test mode: Actions > Uptime check > Run workflow > tick "Test the alert" > Run. That opens a
# clearly marked test issue assigned to Chris and closes it straight away, so the email can be
# confirmed without an outage. The real checks still run in the same run.
#
# GitHub pauses scheduled workflows in repositories with no commits for 60 days; a commit
# of any kind, or "Enable workflow" under Actions, turns it back on.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test the alert: open a test issue assigned to Chris, then close it"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pages: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test the alert (manual test mode only)
        if: github.event_name == 'workflow_dispatch' && inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create uptime-test --repo "${{ github.repository }}" --description "Manual tests of the uptime alert" --color FBCA04 --force >/dev/null 2>&1 || true
          stamp=$(date -u '+%Y-%m-%d %H:%M UTC')
          body="This is a TEST of the uptime alert, started by hand at $stamp. The site is not down."
          body="$body"$'\n\n'"If this issue reached you by email or on the GitHub app, alerts work. It closes itself a moment after opening. Run: $RUN_URL"
          url=$(gh issue create --repo "${{ github.repository }}" \
            --title "TEST: uptime alert check ($stamp)" \
            --label uptime-test \
            --assignee chrisf-officeadv,crysvarther \
            --body "$body")
          echo "Opened $url"
          n=${url##*/}
          gh issue close "$n" --repo "${{ github.repository }}" --comment "Test complete. No outage; nothing to do."
          echo "Closed #$n"

      - name: Home page answers with the real site
        run: |
          code=$(curl -sS -o body.html -w '%{http_code}' --max-time 30 https://mphsd.com/ || echo 000)
          echo "https://mphsd.com/ -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::mphsd.com returned HTTP $code"
            exit 1
          fi
          if ! grep -q "Mitchell Plumbing" body.html; then
            echo "::error::mphsd.com answered 200 but the page does not contain the site's name"
            exit 1
          fi

      - name: www redirects to the site
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 https://www.mphsd.com/ || echo 000)
          echo "https://www.mphsd.com/ (followed) -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::www.mphsd.com ended with HTTP $code"
            exit 1
          fi

      - name: Custom domain is still set on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cname=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname' 2>/dev/null || echo "unreadable")
          echo "Pages custom domain: $cname"
          if [ "$cname" != "mphsd.com" ]; then
            echo "::error::GitHub Pages custom domain is '$cname', expected mphsd.com"
            exit 1
          fi

      - name: Open or update the outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create uptime --repo "${{ github.repository }}" --description "Automatic site availability alerts" --color B60205 --force >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "${{ github.repository }}" --label uptime --state open --json number --jq '.[0].number')
          stamp=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ -z "$existing" ]; then
            body="The scheduled uptime check failed at $stamp. See the run log for which step failed: $RUN_URL"
            body="$body"$'\n\n'"Checks: home page returns 200 with the site's content, www redirects to it, and the GitHub Pages custom domain is still mphsd.com."
            body="$body"$'\n\n'"First things to look at: Settings > Pages (is the custom domain still set?), then https://officeadvantage.github.io/mphsd-website/ (does the site serve there?), then DNS at GoDaddy (see DNS.md). This issue closes itself when a later check passes."
            gh issue create --repo "${{ github.repository }}" \
              --title "mphsd.com is down (uptime check failed $stamp)" \
              --label uptime \
              --assignee chrisf-officeadv,crysvarther \
              --body "$body"
          else
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Still failing at $stamp. Run: $RUN_URL"
          fi

      - name: Close the outage issue when the site is back
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "${{ github.repository }}" --label uptime --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "The uptime check passed again at $(date -u '+%Y-%m-%d %H:%M UTC'); closing automatically."
          done
